<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content studio: AI Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #FBF7EE; --card: #FFFDF7; --sand: #F3EAD3; --ink: #1F2A44; --mute: #5B647C; --rust: #C8451F; --teal: #1B6F6A; --mint: #CFE8E4; --peach: #F9D9C8; --sun: #F6D97A; --bad: #B3321A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; border-bottom: 3px solid var(--ink); background: var(--card); position: sticky; top: 0; z-index: 3; }
header h1 { font: 700 30px/1 Caveat, cursive; color: var(--rust); }
header nav { display: flex; gap: 6px; }
.tab { padding: 7px 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); font-weight: 600; }
.tab.on { background: var(--ink); color: #fff; }
header .grow { flex: 1; }
header a { color: var(--ink); font-size: 14px; }
main { max-width: 1060px; margin: 0 auto; padding: 18px 20px 80px; }
h2 { font: 700 22px/1.2 "Space Grotesk", sans-serif; margin: 6px 0 4px; }
.sub { color: var(--mute); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.pill { padding: 5px 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); font-size: 13.5px; font-weight: 600; }
.pill.on { background: var(--sun); }
.note { background: var(--sand); border: 2px dashed var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 10px 0; }
.snip { border: 2px solid var(--ink); border-radius: 14px; background: var(--card); margin-bottom: 8px; overflow: hidden; }
.snip > button.head { display: flex; width: 100%; gap: 12px; align-items: center; padding: 10px 14px; background: none; border: none; text-align: left; }
.len { font: 700 13.5px "Space Grotesk", sans-serif; background: var(--sun); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px; min-width: 62px; text-align: center; flex: none; }
.head b { font-weight: 600; } .head small { display: block; color: var(--mute); }
.head .grow { flex: 1; min-width: 0; }
.st { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 2px solid var(--ink); flex: none; }
.st.approved { background: var(--teal); color: #fff; } .st.rejected { background: var(--bad); color: #fff; } .st.pending { background: var(--card); }
.flag { font-size: 12px; background: var(--peach); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.body { display: none; padding: 4px 14px 14px; border-top: 2px dashed var(--ink); }
.snip.open .body { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .snip.open .body { grid-template-columns: 1fr; } }
video { width: 100%; border-radius: 10px; background: #14203A; border: 2px solid var(--ink); }
.tx { font-size: 14.5px; margin-top: 8px; }
.tx .ctx { color: #9aa0b0; } .tx .in { background: #FFF3C4; }
.tx .edge { font-weight: 700; color: var(--rust); }
.nudge { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.nudge button, .acts button, .small { padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); font-size: 13px; font-weight: 600; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }
input[type=text], select, textarea { width: 100%; padding: 7px 9px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
textarea { min-height: 96px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.acts .ok { background: var(--teal); color: #fff; } .acts .no { background: var(--bad); color: #fff; }
table { border-collapse: collapse; width: 100%; background: var(--card); font-size: 14px; }
th, td { border-bottom: 1px solid #ddd3bb; padding: 7px 10px; text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
td.y { color: var(--teal); font-weight: 700; } td.n { color: var(--bad); font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 12px 0; }
.card { border: 2px solid var(--ink); border-radius: 14px; background: var(--card); padding: 12px 14px; }
.card b { display: block; font: 700 30px/1.1 "Space Grotesk", sans-serif; }
.card span { font-weight: 600; } .card p { font-size: 13px; color: var(--mute); margin-top: 4px; }
#save { font-size: 13px; color: var(--mute); }
.try { display: flex; gap: 8px; margin: 10px 0; } .try input { flex: 1; }
.try button { padding: 0 16px; border: 2px solid var(--ink); border-radius: 10px; background: var(--ink); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Content studio</h1>
  <nav><button class="tab on" data-tab="review">Review</button><button class="tab" data-tab="search">Search test</button><button class="tab" data-tab="numbers">Numbers</button></nav>
  <span class="grow"></span><span id="save"></span>
  <a href="../">Learner app →</a>
</header>
<main id="main"><p class="sub">Loading…</p></main>
<script src="../js/core.js"></script>
<script src="studio.js"></script>
</body>
</html>
